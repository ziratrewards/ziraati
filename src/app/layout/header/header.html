<header
  class="fixed top-0 left-0 right-0 z-50 bg-white/95 backdrop-blur-md shadow-[0_2px_15px_rgba(0,0,0,0.06)] border-b border-neutral-200/80">
  <div class="bg-neutral-100 border-b border-neutral-200/60 hidden md:block">
    <div class="max-w-7xl mx-auto px-6 h-9 flex items-center justify-between text-xs">
      <div class="flex items-center gap-6 font-semibold">
        <a class="text-brand-red flex items-center gap-1.5 py-1 border-b-2 border-brand-red" href="#"
          aria-current="page">
          Bireysel
        </a>
        <a class="text-neutral-600 hover:text-brand-red transition-colors py-1" href="#">Ticari</a>
        <a class="text-neutral-600 hover:text-brand-red transition-colors py-1" href="#">Kurumsal</a>
      </div>
      <div class="flex items-center gap-6 text-neutral-600">
        <div class="flex items-center gap-2">
          <span class="material-symbols-outlined text-[15px] text-brand-red" aria-hidden="true">support_agent</span>
          <span>Müşteri İletişim Merkezi:</span>
          <a class="font-bold text-neutral-900 hover:text-brand-red transition-colors tracking-tight"
            href="tel:08502200000">
            0850 220 00 00
          </a>
        </div>
        <div class="h-3 w-px bg-neutral-300" role="separator" aria-hidden="true"></div>
        <div class="flex items-center gap-1.5 font-medium">
          <span class="text-brand-red font-bold">TR</span>
          <span class="text-neutral-400" aria-hidden="true">|</span>
          <a class="text-neutral-500 hover:text-neutral-900 transition-colors" href="#" lang="en" hreflang="en">EN</a>
        </div>
      </div>
    </div>
  </div>

  <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between gap-6">
    <div class="flex items-center gap-10">
      <a class="flex items-center group focus-visible:outline-2 focus-visible:outline-brand-red rounded-md" href="#"
        aria-label="Ziraat Bankası Ana Sayfa">
        <img src="/ziraati/images/logo.gif" alt="Ziraat Bankası Logo"
          class="h-11 w-auto object-contain transition-transform duration-200 group-hover:scale-[1.02]" width="132"
          height="44" />
      </a>

      <nav class="hidden xl:flex items-center gap-8" aria-label="Ana navigasyon">
        <a class="text-[14px] font-semibold text-neutral-700 hover:text-brand-red transition-colors" href="#">
          Ürün &amp; Hizmetler
        </a>
        <a class="text-[14px] font-bold text-brand-red relative flex items-center gap-2 py-1" href="#"
          aria-current="page">
          <span>Akıllı Saat Bankacılığı</span>
          <span
            class="bg-brand-red-light text-brand-red text-[10px] font-extrabold px-2 py-0.5 rounded-full uppercase tracking-wider"
            aria-label="Yeni">
            YENİ
          </span>
          <span class="absolute -bottom-2 left-0 right-0 h-0.5 bg-brand-red rounded-full" aria-hidden="true"></span>
        </a>
        <a class="text-[14px] font-semibold text-neutral-700 hover:text-brand-red transition-colors" href="#">
          Dijital Bankacılık
        </a>
        <a class="text-[14px] font-semibold text-neutral-700 hover:text-brand-red transition-colors" href="#">
          Yatırım &amp; Varlık
        </a>
        <a class="text-[14px] font-semibold text-neutral-700 hover:text-brand-red transition-colors" href="#">
          Kampanyalar
        </a>
      </nav>
    </div>

    <div class="flex items-center gap-3">
      <button
        class="w-10 h-10 rounded-full flex items-center justify-center text-neutral-600 hover:text-brand-red hover:bg-neutral-100 transition-colors focus-visible:outline-2 focus-visible:outline-brand-red"
        aria-label="Arama" type="button">
        <span class="material-symbols-outlined text-[22px]" aria-hidden="true">search</span>
      </button>
      <button
        class="w-10 h-10 rounded-full bg-brand-red-light text-brand-red flex items-center justify-center border border-brand-red/20 cursor-pointer hover:bg-brand-red hover:text-white transition-all focus-visible:outline-2 focus-visible:outline-brand-red"
        aria-label="Hesabım" type="button">
        <span class="material-symbols-outlined text-[20px]" aria-hidden="true">person</span>
      </button>
    </div>
  </div>
</header>
