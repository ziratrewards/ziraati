<div class="min-h-screen bg-slate-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8 relative font-sans">
  <div class="absolute top-0 inset-x-0 h-40 bg-gradient-to-b from-slate-200/50 to-transparent pointer-events-none">
  </div>

  <div class="sm:mx-auto sm:w-full sm:max-w-md relative z-10">
    <div class="flex justify-center">
      <div class="w-16 h-16 bg-white rounded-2xl flex items-center justify-center shadow-sm border border-slate-200">
        <span class="material-symbols-outlined text-4xl text-[#e10514]">admin_panel_settings</span>
      </div>
    </div>
    <h2 class="mt-6 text-center text-3xl font-extrabold text-slate-900 tracking-tight">
      Admin Login
    </h2>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md relative z-10">
    <div class="bg-white py-8 px-4 shadow-md sm:rounded-2xl sm:px-10 border border-slate-200">
      <form class="space-y-6" [formGroup]="form" (ngSubmit)="onSubmit()">
        <div>
          <label for="email" class="block text-sm font-bold text-slate-700">
            Email Address <span class="text-[#e10514]">*</span>
          </label>
          <div class="mt-2 relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
              <span class="material-symbols-outlined text-slate-400 text-[20px]">mail</span>
            </div>
            <input id="email" formControlName="email" type="email" autocomplete="email" placeholder="admin@example.com"
              class="appearance-none block w-full pl-11 pr-3 py-3 border border-slate-300 rounded-xl shadow-sm placeholder-slate-400 bg-slate-50 hover:bg-white text-slate-900 focus:outline-none focus:ring-4 focus:ring-red-100 focus:border-[#e10514] sm:text-sm transition-all font-medium" />
          </div>
        </div>

        <div>
          <label for="password" class="block text-sm font-bold text-slate-700">
            Password <span class="text-[#e10514]">*</span>
          </label>
          <div class="mt-2 relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
              <span class="material-symbols-outlined text-slate-400 text-[20px]">lock</span>
            </div>
            <input id="password" formControlName="password" [type]="passwordVisible() ? 'text' : 'password'"
              autocomplete="current-password" placeholder="••••••••"
              class="appearance-none block w-full pl-11 pr-12 py-3 border border-slate-300 rounded-xl shadow-sm placeholder-slate-400 bg-slate-50 hover:bg-white text-slate-900 focus:outline-none focus:ring-4 focus:ring-red-100 focus:border-[#e10514] sm:text-sm transition-all font-medium tracking-widest" />
            <button type="button" (click)="togglePasswordVisibility()"
              class="absolute inset-y-0 right-0 pr-3.5 flex items-center cursor-pointer text-slate-400 hover:text-slate-600 transition-colors">
              <span class="material-symbols-outlined text-[20px]">{{ passwordVisible() ? 'visibility_off' : 'visibility'
                }}</span>
            </button>
          </div>
        </div>

        <div>
          <button type="submit" [disabled]="form.invalid || isSubmitting()"
            class="w-full flex justify-center items-center gap-2 py-3.5 px-4 border border-transparent rounded-xl shadow-lg shadow-red-100 text-sm font-bold text-white bg-[#e10514] hover:bg-[#c8102e] focus:outline-none focus:ring-4 focus:ring-red-100 transition-all duration-200 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed group">
            @if (isSubmitting()) {
            <span class="material-symbols-outlined text-lg animate-spin">progress_activity</span>
            <span>Signing in...</span>
            } @else {
            <span>Sign In</span>
            <span
              class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
            }
          </button>
        </div>
      </form>

    </div>
  </div>
</div>
