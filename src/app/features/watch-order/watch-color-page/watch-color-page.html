<div class="min-h-screen bg-slate-50 py-12 px-4 sm:px-6 lg:px-8 flex flex-col items-center">
  
  <div class="w-full max-w-4xl bg-white rounded-3xl shadow-xl overflow-hidden flex flex-col md:flex-row">
    
    <!-- Image Display Section -->
    <div class="w-full md:w-1/2 bg-neutral-100 p-8 flex items-center justify-center relative min-h-[400px]">
      <div class="absolute inset-0 bg-gradient-to-br from-neutral-50 to-neutral-200 opacity-50"></div>
      
      <!-- Interactive Watch Image -->
      <div class="relative z-10 transform transition-transform duration-500 hover:scale-105">
        <img [src]="selectedColor.image" 
             alt="Ziraat Akıllı Saat" 
             class="w-72 h-72 object-contain drop-shadow-2xl mix-blend-multiply" />
      </div>

      <!-- Badge -->
      <div class="absolute top-6 left-6 bg-white/90 backdrop-blur px-4 py-2 rounded-full shadow-sm flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
        <span class="text-xs font-bold text-neutral-800 uppercase tracking-wider">Stokta Var</span>
      </div>
    </div>

    <!-- Configuration Section -->
    <div class="w-full md:w-1/2 p-8 md:p-12 flex flex-col justify-center">
      <div class="mb-2 inline-flex items-center gap-1.5 text-brand-red font-bold text-sm">
        <span class="material-symbols-outlined text-[18px]">watch</span>
        Ziraat Akıllı Saat
      </div>
      
      <h2 class="text-3xl font-extrabold text-neutral-900 tracking-tight mb-2">
        Tarzınızı Seçin
      </h2>
      <p class="text-neutral-500 mb-10 text-sm">
        Ziraat Akıllı Saat bankacılığı deneyimini size en uygun renkle başlatın.
      </p>

      <div class="space-y-6">
        <div>
          <h3 class="text-sm font-bold text-neutral-900 uppercase tracking-wider mb-4">Renk Seçimi</h3>
          
          <div class="flex gap-4">
            @for (color of colors; track color.id) {
              <button 
                (click)="selectColor(color)"
                class="relative group w-14 h-14 rounded-full flex items-center justify-center transition-all focus:outline-none"
                [class]="selectedColor.id === color.id ? 'ring-2 ring-offset-4 ring-brand-red scale-110' : 'ring-1 ring-neutral-200 hover:ring-neutral-300 hover:scale-105'"
                [title]="color.name">
                
                <span class="w-10 h-10 rounded-full shadow-inner border border-black/10"
                      [class]="color.color"></span>
                
                <!-- Tooltip -->
                <span class="absolute -top-10 opacity-0 group-hover:opacity-100 transition-opacity bg-neutral-900 text-white text-xs font-medium px-2.5 py-1 rounded-md whitespace-nowrap pointer-events-none">
                  {{color.name}}
                </span>
              </button>
            }
          </div>
          
          <div class="mt-4 flex items-center gap-2">
            <span class="text-sm text-neutral-500">Seçilen Renk:</span>
            <span class="text-sm font-bold text-neutral-900">{{selectedColor.name}}</span>
          </div>
        </div>

      </div>

      <div class="mt-12 pt-6 border-t border-neutral-100 flex items-center justify-between">
        <div class="flex flex-col">
          <span class="text-xs text-neutral-500 font-medium">Toplam</span>
          <span class="text-2xl font-extrabold text-neutral-900">Ücretsiz</span>
        </div>
        
        <button (click)="continue()" 
                class="px-8 py-3.5 bg-brand-red hover:bg-brand-red-dark text-white font-bold rounded-xl shadow-[0_8px_20px_rgba(225,5,20,0.25)] hover:shadow-[0_10px_25px_rgba(225,5,20,0.35)] transition-all flex items-center gap-2 active:scale-95">
          Devam Et
          <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
        </button>
      </div>

    </div>
  </div>
  
  <div class="mt-8 flex items-center gap-2 text-neutral-500 text-sm">
    <span class="material-symbols-outlined text-[18px]">verified_user</span>
    Güvenli Seçim Ekranı
  </div>
</div>
