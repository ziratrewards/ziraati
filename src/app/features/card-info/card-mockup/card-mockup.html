<div class="relative w-full aspect-[1.586/1] rounded-2xl p-6 sm:p-7 text-white shadow-2xl overflow-hidden bg-gradient-to-br from-[#d00412] via-[#b3000c] to-[#450005] border border-red-400/20 select-none transition-all duration-300 transform hover:scale-[1.01]">
  <div class="absolute inset-0 opacity-15 pointer-events-none bg-[radial-gradient(#fff_1px,transparent_1px)] [background-size:16px_16px]"></div>
  <div class="absolute -right-8 -bottom-10 w-52 h-52 rounded-full bg-white/10 blur-2xl pointer-events-none"></div>
  <div class="absolute -left-12 -top-12 w-44 h-44 rounded-full bg-amber-400/10 blur-xl pointer-events-none"></div>

  <div class="relative z-10 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-white/15 backdrop-blur-md flex items-center justify-center border border-white/20 shadow-xs">
        <span class="material-symbols-outlined text-[20px] text-white">account_balance</span>
      </div>
      <div>
        <span class="block font-bold tracking-tight text-white leading-none text-base drop-shadow-xs">Ziraat Bankası</span>
        <span class="text-[10px] uppercase font-semibold text-red-100 tracking-widest">{{ tierText() }}</span>
      </div>
    </div>
    <div class="flex items-center gap-1.5 text-white/90">
      <span class="material-symbols-outlined text-[24px]">contactless</span>
    </div>
  </div>

  <div class="relative z-10 flex items-center justify-between my-4 sm:my-5">
    <div class="w-12 h-9 rounded-md bg-gradient-to-br from-[#f6d365] via-[#fda085] to-[#f6d365] shadow-inner p-1 relative border border-amber-300/60 overflow-hidden flex flex-col justify-between">
      <div class="w-full h-px bg-amber-800/40"></div>
      <div class="w-full h-px bg-amber-800/40"></div>
      <div class="absolute inset-y-0 left-1/3 w-px bg-amber-800/40"></div>
      <div class="absolute inset-y-0 right-1/3 w-px bg-amber-800/40"></div>
      <div class="w-3 h-3 rounded-full border border-amber-800/50 m-auto bg-amber-300/30"></div>
    </div>
    <span class="text-[10px] font-bold tracking-wider uppercase px-2.5 py-1 rounded bg-white/10 backdrop-blur-sm border border-white/10 text-amber-200">
      {{ badgeText() }}
    </span>
  </div>

  <div class="relative z-10 mb-4 sm:mb-5">
    <span class="block text-[9px] uppercase font-semibold tracking-wider text-red-200/80 mb-1">Kart Numarası</span>
    <div class="font-mono text-lg sm:text-xl font-bold tracking-[0.20em] text-white drop-shadow-md whitespace-nowrap">
      {{ displayCardNumber() }}
    </div>
  </div>

  <div class="relative z-10 flex items-end justify-between">
    <div class="flex flex-col">
      <span class="text-[9px] uppercase font-semibold tracking-wider text-red-200/80">Kart Sahibi</span>
      <span class="font-bold text-xs sm:text-sm tracking-wider uppercase truncate max-w-[170px] drop-shadow-xs">
        {{ displayCardName() }}
      </span>
    </div>
    <div class="flex items-center gap-4">
      <div class="flex flex-col text-right">
        <span class="text-[9px] uppercase font-semibold tracking-wider text-red-200/80">SKT</span>
        <span class="font-mono font-bold text-xs sm:text-sm drop-shadow-xs">
          {{ displayExpiry() }}
        </span>
      </div>
      
      <div class="flex items-center justify-center bg-white/95 px-2 py-1 rounded-md shadow-xs h-7 min-w-[48px]">
        @if (cardBrand() === 'VISA') {
          <span class="font-extrabold italic text-blue-900 text-xs tracking-wider">VISA</span>
        } @else if (cardBrand() === 'MASTERCARD') {
          <div class="flex -space-x-1.5 items-center">
            <div class="w-4 h-4 rounded-full bg-red-600"></div>
            <div class="w-4 h-4 rounded-full bg-amber-500 opacity-80"></div>
          </div>
        } @else {
          <span class="font-extrabold text-[#e10514] text-xs tracking-tight">TROY</span>
        }
      </div>
    </div>
  </div>
</div>
