@if (isOpen()) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-neutral-900/70 backdrop-blur-sm animate-fade-in-scale"
    role="dialog"
    aria-modal="true"
    aria-labelledby="qr-modal-title"
    (click)="onBackdropClick($event)"
  >
    <div class="relative bg-white rounded-3xl p-8 md:p-10 max-w-md w-full mx-4 shadow-2xl flex flex-col items-center text-center border border-neutral-100">
      <button
        class="absolute top-5 right-5 w-10 h-10 rounded-full bg-neutral-100 hover:bg-neutral-200 text-neutral-600 hover:text-neutral-900 flex items-center justify-center transition-colors focus-visible:outline-2 focus-visible:outline-brand-red"
        (click)="close.emit()"
        aria-label="Modalı kapat"
        type="button"
      >
        <span class="material-symbols-outlined text-[20px]" aria-hidden="true">close</span>
      </button>

      <div class="w-14 h-14 rounded-2xl bg-brand-red-light text-brand-red flex items-center justify-center mb-4" aria-hidden="true">
        <span class="material-symbols-outlined text-[32px]">qr_code_scanner</span>
      </div>

      <h2 id="qr-modal-title" class="text-xl font-bold text-neutral-900 mb-1">Ziraat Mobil ile Eşleştir</h2>
      <p class="text-sm text-neutral-500 mb-6 leading-relaxed">
        Akıllı saatinizdeki Ziraat uygulamasını açın ve telefonunuzun kamerası ile aşağıdaki dinamik kodu taratın.
      </p>

      <div class="p-6 bg-neutral-50 rounded-2xl border border-neutral-200/80 mb-6 relative flex flex-col items-center justify-center shadow-inner">
        <svg class="w-44 h-44 text-neutral-900" fill="currentColor" viewBox="0 0 100 100" aria-hidden="true">
          <rect fill="none" height="28" rx="4" stroke="currentColor" stroke-width="4" width="28" x="5" y="5"></rect>
          <rect fill="currentColor" height="16" rx="2" width="16" x="11" y="11"></rect>
          <rect fill="none" height="28" rx="4" stroke="currentColor" stroke-width="4" width="28" x="67" y="5"></rect>
          <rect fill="currentColor" height="16" rx="2" width="16" x="73" y="11"></rect>
          <rect fill="none" height="28" rx="4" stroke="currentColor" stroke-width="4" width="28" x="5" y="67"></rect>
          <rect fill="currentColor" height="16" rx="2" width="16" x="11" y="73"></rect>
          <rect fill="currentColor" height="8" width="8" x="38" y="10"></rect>
          <rect fill="currentColor" height="16" width="8" x="50" y="10"></rect>
          <rect fill="currentColor" height="8" width="8" x="38" y="24"></rect>
          <rect fill="currentColor" height="6" width="12" x="10" y="38"></rect>
          <rect fill="currentColor" height="8" width="8" x="26" y="38"></rect>
          <rect fill="#e10514" height="24" rx="4" width="24" x="38" y="38"></rect>
          <path d="M46 50L49 53L55 47" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
          <rect fill="currentColor" height="12" width="10" x="66" y="38"></rect>
          <rect fill="currentColor" height="6" width="10" x="80" y="38"></rect>
          <rect fill="currentColor" height="14" width="10" x="80" y="48"></rect>
          <rect fill="currentColor" height="14" width="6" x="38" y="66"></rect>
          <rect fill="currentColor" height="6" width="14" x="48" y="66"></rect>
          <rect fill="currentColor" height="14" width="24" x="48" y="76"></rect>
          <rect fill="currentColor" height="6" width="14" x="76" y="66"></rect>
        </svg>
        <span class="mt-3 font-semibold text-xs text-brand-red tracking-wider uppercase" aria-live="polite">
          02:59 Dinamik Süre
        </span>
      </div>

      <div class="flex items-center gap-2 text-emerald-700 text-xs font-semibold bg-emerald-50 px-4 py-2 rounded-full border border-emerald-200">
        <span class="material-symbols-outlined text-[16px]" aria-hidden="true">verified_user</span>
        <span>256-Bit Uçtan Uca Şifreli Eşleşme</span>
      </div>
    </div>
  </div>
}
